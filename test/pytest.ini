[pytest]
# Run from anywhere:  pytest test            (rootdir is test/)
testpaths = replay tooling integration unit
pythonpath = support device
python_files = test_*.py
addopts = -ra -p no:cacheprovider
markers =
    unit: C unit tests that link real Source/ files and measure gcov coverage
    replay: regression tests that recompile functions extracted from production C
    integration: tests that drive several real modules and/or real FFmpeg, libass, media files
    tooling: tests of the device-side analyzers and campaign scripts
    slow: takes more than ~10 seconds
